[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dealership-core"
version = "0.1.0"
description = "Reusable domain helpers and validation rules for the dealership application."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dealership Management System Team" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "packages",
    "packages.dealership_core",
]
